# Tells Grafana to load every dashboard JSON file in this folder on
# startup. Pairs with fraud-api.json -- same reasoning as the datasource
# provisioning file: declared once, reproduced every time, not built by
# hand against state that disappears with the container.
apiVersion: 1

providers:
  - name: fraud-api
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
